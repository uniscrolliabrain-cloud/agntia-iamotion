name: Build visual entities
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-visual-entities.yml']
permissions:
  contents: write
concurrency:
  group: visual-entities
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node lab/scripts/build-entities.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/entities lab/observability/entity-build.json
          git diff --cached --quiet || git commit -m "Generate lexical visual entities"
          git push origin HEAD:main
