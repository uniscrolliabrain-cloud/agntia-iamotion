name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run build:knowledge
      - run: pnpm test
      - run: pnpm run build:demo
      - run: pnpm audit:library > "$RUNNER_TEMP/library-audit.json"
      - name: Verify the local synthetic pipeline
        run: |
          mkdir -p lab/staging
          pnpm smoke:rag lab/staging/rag-corpora > lab/staging/rag-durable.json
          pnpm smoke:proposal > "$RUNNER_TEMP/motion-proposal.json"
          pnpm smoke:pipeline > "$RUNNER_TEMP/local-pipeline.json"
          pnpm smoke:graphics-knowledge > "$RUNNER_TEMP/graphics-knowledge.json"
          pnpm smoke:host-api > "$RUNNER_TEMP/host-contract.json"
