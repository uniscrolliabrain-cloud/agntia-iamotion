<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agntia · Estudio material</title><style>
*{box-sizing:border-box}body{margin:0;background:#fcfaf6;color:#242421;font:16px Manrope,system-ui,sans-serif}main{max-width:900px;margin:auto;padding:clamp(24px,6vw,80px)}h1{font:400 clamp(36px,6vw,64px)/1.05 Fraunces,Georgia,serif;letter-spacing:-.045em;margin:16px 0}small{letter-spacing:.12em;color:#6e6c66}
h2{font:600 12px/1 Manrope,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6e6c66;margin:32px 0 10px}
.stage{position:relative;isolation:isolate;padding:clamp(20px,6vw,64px);border-radius:24px;overflow:hidden;margin:32px 0;transition:background 320ms cubic-bezier(.22,1,.36,1)}
.stage[data-ground=paper]{background:#f2efe8}
.stage[data-ground=sand]{background:#ece4d6}
.stage[data-ground=lavender]{background:#f0ecfc}
.stage[data-ground=ink]{background:#211f1c}
.orb{position:absolute;z-index:-1;right:8%;top:10%;width:48%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff,#e5d9f5 40%,#b4a0d8 85%);box-shadow:0 20px 40px #6550dd18;transition:background 320ms cubic-bezier(.22,1,.36,1),box-shadow 320ms cubic-bezier(.22,1,.36,1)}
.stage[data-ground=ink] .orb{background:radial-gradient(circle at 32% 25%,#b8a6ff,#6550dd 45%,#241d4d 88%);box-shadow:0 24px 60px #6550dd44}
.panel{padding:clamp(24px,5vw,48px);background:var(--ag-motion-surface,#fffaf5);backdrop-filter:blur(var(--ag-motion-blur,0px));border:1px solid rgba(255,255,255,var(--ag-motion-highlight,.1));border-radius:var(--ag-motion-radius,16px);transform:perspective(900px) translateY(calc(-1 * var(--ag-motion-elevation,0px))) rotateX(var(--ag-motion-tilt,0deg));color:#242421;outline:none}
.stage[data-lighting=diffuse] .panel{box-shadow:0 18px 42px rgba(48,32,71,var(--ag-motion-shadow,.12)),inset 0 1px 2px rgba(255,255,255,var(--ag-motion-highlight,.1))}
.stage[data-lighting=direct] .panel{box-shadow:0 2px 7px rgba(48,32,71,calc(var(--ag-motion-shadow,.12) * 1.9)),0 26px 60px rgba(48,32,71,calc(var(--ag-motion-shadow,.12) * .55)),inset 0 1px 1px rgba(255,255,255,calc(var(--ag-motion-highlight,.1) * 1.6))}
.panel:focus-visible{border-color:#6550dd;box-shadow:0 0 0 3px #6550dd,0 18px 42px rgba(48,32,71,var(--ag-motion-shadow,.12))}
.panel strong{display:block;font:400 clamp(32px,7vw,60px) Fraunces,Georgia,serif;margin:16px 0}
.panel .rule{display:block;width:40px;height:2px;background:#b49665;margin-top:24px}
.rack,.controls{display:flex;flex-wrap:wrap;gap:8px}
.rack button,.controls button{font:600 13px Manrope,system-ui,sans-serif;background:#fffaf5;color:#242421;border:1px solid #ded7ca;border-radius:9px;padding:10px 14px;cursor:pointer;transition:background 140ms,color 140ms,border-color 140ms}
.rack button:hover,.controls button:hover{background:#f2efe8}
.rack button[aria-pressed=true],.controls button[aria-pressed=true]{background:#6550dd;color:#fff;border-color:#6550dd}
.rack button:focus-visible,.controls button:focus-visible{outline:3px solid #242421;outline-offset:2px}
p{line-height:1.6}
[data-material-status]{font:600 13px/1.4 Manrope,system-ui,sans-serif;letter-spacing:.02em;color:#242421;margin:14px 0 0}
pre[data-material-spec]{margin:16px 0 0;padding:16px;background:#f2efe8;border:1px solid #ded7ca;border-radius:12px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#4a4842;overflow-x:auto}
@media(prefers-reduced-motion:reduce){.panel,.orb,.stage{transition:none}.panel{transform:none}}
</style><main>
<small>AGNTIA · MATERIAL STUDY 01</small>
<h1>La materia responde.</h1>
<p>Estudio de una superficie editorial transformable: siete estados, cuatro suelos, dos luces. La pose se lee del motor, no se inventa en CSS.</p>
<section class="stage" data-stage data-ground="paper" data-lighting="diffuse">
<div class="orb" aria-hidden="true"></div>
<article class="panel" data-material-panel tabindex="0" role="group" aria-label="Superficie de ejemplo"><small>INGRESOS · DEMO</small><strong>52.450 €</strong><span>Ingresos del periodo</span><span class="rule" aria-hidden="true"></span></article>
</section>
<h2>Estado</h2>
<div class="rack" role="group" aria-label="Estado de la superficie"></div>
<h2>Suelo y luz</h2>
<div class="controls" data-grounds role="group" aria-label="Suelo"></div>
<div class="controls" data-lightings role="group" aria-label="Iluminación" style="margin-top:8px"></div>
<p data-material-status aria-live="polite">Papel editorial</p>
<pre data-material-spec aria-label="Pose calculada"></pre>
</main><script type="module">import {mountMaterialSurface} from './src/material-surface.js';const dispose=mountMaterialSurface(document.querySelector('main'));window.addEventListener('pagehide',dispose,{once:true});</script></html>
